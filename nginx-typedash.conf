# TypeDash API Nginx Server Configuration (api2.songyang.dev)
# Place this file in /etc/nginx/conf.d/typedash.conf or /etc/nginx/sites-available/typedash
# If using sites-available, symlink to sites-enabled:
#   ln -s /etc/nginx/sites-available/typedash /etc/nginx/sites-enabled/

# Upstream backend server
upstream typedash_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api2.songyang.dev;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server (reverse proxy only)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api2.songyang.dev;

    # SSL Configuration
    # Update these paths to your actual SSL certificate locations
    ssl_certificate /etc/letsencrypt/live/api2.songyang.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api2.songyang.dev/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logging
    access_log /var/log/nginx/typedash-api-access.log;
    error_log /var/log/nginx/typedash-api-error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # WebSocket endpoint
    location /ws {
        proxy_pass http://typedash_backend;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else -> backend (Gin routes live at /login, /categories, etc.)
    location / {
        proxy_pass http://typedash_backend;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cookie and credential handling
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_path / /;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (optional, for monitoring)
    location /healthz {
        proxy_pass http://typedash_backend/healthz;
        access_log off;
    }
}

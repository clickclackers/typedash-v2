services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    volumes:
      # Mount the repo's Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist Caddy certificates and config
      - caddy_data:/data
      - caddy_config:/config

  server:
    # Set RELEASE_TAG in CI to pin a tag/SHA.
    image: ghcr.io/clickclackers/typedash-v2:${RELEASE_TAG:-latest}
    expose:
      - "3000"
    environment:
      GIN_MODE: release
    secrets:
      - jwt_secret
      - postgres_user
      - postgres_password
      - postgres_db
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $(cat /run/secrets/postgres_user) -d $(cat /run/secrets/postgres_db)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  postgres_db:
    file: ./secrets/postgres_db
  jwt_secret:
    file: ./secrets/jwt_secret

volumes:
  db_data: {}
  caddy_data: {}
  caddy_config: {}

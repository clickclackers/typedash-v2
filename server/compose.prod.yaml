services:
  server:
    # Pull image from GHCR
    # Set RELEASE_TAG in CI to pin a tag/SHA.
    image: ghcr.io/clickclackers/typedash-v2:${RELEASE_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: /run/secrets/jwt_secret
      POSTGRES_USER: /run/secrets/postgres_user
      POSTGRES_PASSWORD: /run/secrets/postgres_password
      POSTGRES_DB: /run/secrets/postgres_db
      GIN_MODE: release
    secrets:
      - jwt_secret
      - postgres_user
      - postgres_password
      - postgres_db
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: /run/secrets/postgres_user
      POSTGRES_PASSWORD: /run/secrets/postgres_password
      POSTGRES_DB: /run/secrets/postgres_db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

secrets:
  postgres_user:
    environment: "POSTGRES_USER"
  postgres_password:
    environment: "POSTGRES_PASSWORD"
  postgres_db:
    environment: "POSTGRES_DB"
  jwt_secret:
    environment: "JWT_SECRET"

volumes:
  db_data: {}

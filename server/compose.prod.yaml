services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    volumes:
      # Mount the repo's Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist Caddy certificates and config
      - caddy_data:/data
      - caddy_config:/config

  server:
    # Pull image from GHCR
    # Set RELEASE_TAG in CI to pin a tag/SHA.
    image: ghcr.io/clickclackers/typedash-v2:${RELEASE_TAG:-latest}
    # Do not publish the app port to the host; expose it internally so nginx can proxy by service name
    expose:
      - "3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: {}
  caddy_data: {}
  caddy_config: {}

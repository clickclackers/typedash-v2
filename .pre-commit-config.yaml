repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash -c 'cd server && go fmt ./...'
        language: system
        types: [go]
        files: ^server/
        pass_filenames: false

      - id: go-imports
        name: go imports
        entry: bash -c 'cd server && goimports -w .'
        language: system
        types: [go]
        files: ^server/
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd server && golangci-lint run ./...'
        language: system
        types: [go]
        files: ^server/
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: bash -c 'cd server && go vet ./...'
        language: system
        types: [go]
        files: ^server/
        pass_filenames: false

  - repo: local
    hooks:
      - id: client-lint-staged
        name: client lint-staged
        entry: bash -c 'cd client && npx lint-staged'
        language: system
        files: ^client/
        pass_filenames: false

      - id: client-typecheck
        name: client typecheck
        entry: bash -c 'cd client && npx tsc --noEmit'
        language: system
        files: ^client/
        pass_filenames: false

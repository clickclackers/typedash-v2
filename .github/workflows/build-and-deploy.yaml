name: Build and Deploy Server

on:
  push:
    branches:
      - main
      - feature/singleplayer-crud
    # Only rebuild when server / Go module / workflow changes
    paths:
      - "server/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-and-deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/typedash-v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Copy compose.prod.yaml and Caddyfile to Droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_KEY }}
          fingerprint: ${{ secrets.DROPLET_FINGERPRINT }}
          source: "server/compose.prod.yaml,server/Caddyfile"
          target: "~/typedash"
          strip_components: 1
      - name: Copy database migrations to Droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_KEY }}
          fingerprint: ${{ secrets.DROPLET_FINGERPRINT }}
          source: "server/db/migrations"
          target: "~/typedash/db/migrations"
          strip_components: 1

      - name: Deploy and run migrations on Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_KEY }}
          fingerprint: ${{ secrets.DROPLET_FINGERPRINT }}
          script: |
            mkdir -p ~/typedash/secrets
            echo "${{ secrets.JWT_SECRET }}" > ~/typedash/secrets/jwt_secret
            echo "${{ secrets.POSTGRES_USER }}" > ~/typedash/secrets/postgres_user
            echo "${{ secrets.POSTGRES_PASSWORD }}" > ~/typedash/secrets/postgres_password
            echo "${{ secrets.POSTGRES_DB }}" > ~/typedash/secrets/postgres_db
            chmod 666 ~/typedash/secrets/*

            set -e
            trap 'echo "Error on line $LINENO"; exit 1' ERR

            cd ~/typedash && docker compose -f compose.prod.yaml up -d --pull always

            # Run database migrations
            migrate -path ~/typedash/db/migrations -database "postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}" up

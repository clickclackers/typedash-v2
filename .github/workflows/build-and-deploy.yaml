name: Build and Deploy Server

on:
  push:
    branches:
      - main
    # Only rebuild when server / workflow changes
    paths:
      - "server/**"
      - ".github/workflows/build-and-deploy.yaml"
  workflow_dispatch:
    # TODO: Add release tag input

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/typedash-v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: server/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Copy compose, migrations, and seed files to OVH VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          key: ${{ secrets.OVH_SSH_KEY }}
          source: "server/compose.prod.yaml,server/db/migrations,server/db/seed.sql"
          target: "~/typedash"
          strip_components: 1

      - name: Deploy on OVH VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set -e
            trap 'echo "Error on line $LINENO"; exit 1' ERR

            cd ~/typedash && docker compose -f compose.prod.yaml up -d --pull always

      - name: Run migrations on OVH VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set -e
            trap 'echo "Error on line $LINENO"; exit 1' ERR

            # Install golang-migrate CLI if not present
            if ! command -v migrate >/dev/null 2>&1; then
              curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz \
                | tar xz
              sudo mv migrate /usr/local/bin/migrate
              sudo chmod +x /usr/local/bin/migrate
            fi

            # sslmode=disable is required for golang-migrate to work
            migrate -path ~/typedash/db/migrations -database "postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}?sslmode=disable" up
